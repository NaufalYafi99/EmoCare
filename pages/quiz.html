
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz — Emocare</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: "#849985",
                        "sage-dark": "#657C68",
                        cream: "#E9E7DC",
                        lavender: "#D9CFE8",
                        peach: "#EBC9B8",
                        charcoal: "#303C35",
                        background: "#F8F7F2"
                    },
                    fontFamily: {
                        sans: ["DM Sans", "sans-serif"],
                        serif: ["Lora", "serif"]
                    }
                }
            }
        };
    </script>

    <link
    href="https://unpkg.com/aos@2.3.1/dist/aos.css"
    rel="stylesheet"
>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<header class="bg-white border-b border-gray-100">
    <nav class="max-w-6xl mx-auto px-6 py-5 flex justify-between">
        <a href="../index.html" class="text-2xl font-bold">emocare<span class="text-sage">.</span></a>
       <a href="dashboard.html" class="back-button">
    <span class="back-icon">
        <i class="fa-solid fa-arrow-left"></i>
    </span>
    <span>Back to Dashboard</span>
</a>
    </nav>
</header>

<main class="max-w-3xl mx-auto px-6 py-12">

    <section class="text-center mb-10">
        <span class="text-sage text-xs font-bold uppercase tracking-widest">
            Learn about emotions
        </span>

        <h1 class="font-serif text-4xl md:text-5xl mt-5">
            Emotional awareness quiz.
        </h1>

        <p class="text-gray-500 mt-4">
            Explore your understanding of emotions.
        </p>
    </section>

    <section id="quiz-container" class="bg-white rounded-3xl p-7 md:p-10 soft-shadow">

        <div class="flex justify-between items-center text-sm text-gray-400 mb-5">
            <span id="question-number">Question 1 of 5</span>
            <span id="question-progress">0%</span>
        </div>

        <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
            <div id="progress-bar" class="h-full bg-sage rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>

        <h2 id="question-text" class="font-serif text-2xl md:text-3xl mt-10 leading-relaxed"></h2>

        <div id="answer-options" class="space-y-4 mt-8"></div>

        <div id="quiz-feedback" class="hidden mt-7 p-5 rounded-2xl text-sm leading-7" aria-live="polite"></div>

        <div class="flex justify-between items-center mt-9">
            <button id="restart-quiz"
                    class="text-gray-400 text-sm hover:text-sage hidden">
                Restart
            </button>

            <button id="next-question"
                    class="bg-sage text-white px-8 py-4 rounded-full hover:bg-sage-dark transition ml-auto"
                    disabled>
                Next question →
            </button>
        </div>

    </section>

    <section id="quiz-result" class="hidden bg-white rounded-3xl p-10 soft-shadow text-center mt-8">

        <span class="text-5xl">🌿</span>

        <h2 class="font-serif text-3xl mt-6">Quiz completed!</h2>

        <p class="text-gray-400 mt-4">Your learning score</p>

        <p id="final-score" class="text-6xl font-bold text-sage mt-4">0/5</p>

        <p id="result-message" class="text-gray-500 leading-7 mt-5"></p>

        <button id="try-again"
                class="mt-8 bg-sage text-white px-8 py-4 rounded-full hover:bg-sage-dark transition">
            Try again
        </button>

    </section>

    <p class="text-xs text-gray-400 text-center mt-8 leading-6">
        This quiz is an educational activity, not a psychological assessment.
    </p>

</main>

<script src="../assets/js/storage.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/quiz.js"></script>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
    AOS.init({
        duration: 800,
        easing: "ease-out-cubic",
        once: true,
        offset: 80,
        delay: 50
    });
</script>
</body>
</html>
